<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>رفیق</title>


    <style>

        body{
            background:#dff6ff;
            font-family:tahoma;
            text-align:center;
            margin-top:120px;
        }

        h1{
            color:#0066cc;
            font-size:50px;
        }

        p{
            font-size:22px;
            color:#333;
        }
     
    

        button{
            margin-top:20px;
            padding:15px 35px;
            font-size:20px;
            background:#0066cc;
            color:white;
            border:none;
            border-radius:10px;
            cursor:pointer;
        }

        button:hover{
            background:#004999;
        }

        .card{
    width:300px;
    margin:30px auto;
    padding:20px;
    background:white;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,.2);

    display:none;

    opacity:0;
    transform:translateY(30px);

    transition:.6s;
}

#message{
    font-size:22px;
    color:#0066cc;
    margin-top:25px;
    font-weight:bold;
}

    </style>

</head>

<body>

<h1 id="title">😎 سلام رفیق</h1>

<p>به اولین سایت حرفه‌ای من خوش اومدی.</p>

<button onclick="welcome()">
شروع کنیم
</button>
<div id="card" class="card">
    🎉 خیلی خوش اومدی رفیق!<br><br>
    حال میکنی اومدی سایتمو چک میکنی🚀
</div>

<p id="message"></p>

<script>
function welcome(){

    document.body.style.backgroundColor="lightblue";

    document.getElementById("title").innerHTML =
    "🚀 خوش اومدی به دنیای من";

    let card = document.getElementById("card");

    card.style.display="block";

    setTimeout(function(){

        card.style.opacity="1";
        card.style.transform="translateY(0)";

    },100);

    document.querySelector("button").style.display = "none";
    document.getElementById("message").innerHTML =
    "🎯 هدف امروز: فضول یابی HTML، CSS و JavaScript";
}

}
</script>

</body>

</html>
